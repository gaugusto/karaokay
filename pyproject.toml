[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke"
version = "0.1.0"
description = "Aplicativo de karaokê em Python/PySide6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "yt-dlp", "audio-separator"]

[project.optional-dependencies]
# Escolha uma: pip install -e ".[gpu]" (NVIDIA) ou pip install -e ".[cpu]"
gpu = ["audio-separator[gpu]"]
cpu = ["audio-separator[cpu]"]
dev = ["pytest"]

[project.scripts]
karaoke = "karaoke.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
