[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke"
version = "0.1.0"
description = "Aplicativo de karaokê em Python/PySide6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.scripts]
karaoke = "karaoke.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
