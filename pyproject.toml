[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke"
version = "0.1.0"
description = "Aplicativo de karaokê em Python/PySide6"
readme = "README.md"
# <3.14: o audio-separator trava o beartype em 0.18, que não suporta o Python 3.14
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6>=6.6",
    "yt-dlp",
    "audio-separator",
    # O audio-separator importa o audioread, mas não o declara; o librosa 1.0
    # deixou de instalá-lo. Sem ele a separação falha ao ler o áudio.
    "audioread>=3.1",
    # Player: leitura dos FLAC separados e mistura das faixas
    "numpy",
    "soundfile",
]

[project.optional-dependencies]
# Escolha uma: pip install -e ".[gpu]" (NVIDIA) ou pip install -e ".[cpu]"
gpu = ["audio-separator[gpu]"]
cpu = ["audio-separator[cpu]"]
dev = ["pytest"]

[project.scripts]
karaoke = "karaoke.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
